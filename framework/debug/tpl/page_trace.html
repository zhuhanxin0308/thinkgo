<style>
#think_page_trace { position: fixed; bottom: 0; right: 0; font-size: 14px; width: 100%; z-index: 999999; color: #000; text-align: left; font-family: "微软雅黑"; }
#think_page_trace_tab { display: none; background: white; height: 300px; border-top: 1px solid #e0e0e0; }
#think_page_trace_open { height: 30px; float: right; text-align: right; overflow: hidden; position: fixed; bottom: 0; right: 0; color: #fff; background: #333; padding: 0 10px; line-height: 30px; cursor: pointer; }
#think_page_trace_close { display: none; float: right; width: 30px; height: 30px; line-height: 30px; text-align: center; cursor: pointer; }
.think-page-trace-tab-tit { height: 30px; padding: 0 10px; border-bottom: 1px solid #e0e0e0; background: #f3f3f3; }
.think-page-trace-tab-tit span { float: left; height: 30px; line-height: 30px; padding: 0 15px; cursor: pointer; color: #333; }
.think-page-trace-tab-tit span.active { color: #009688; border-bottom: 2px solid #009688; }
.think-page-trace-tab-cont { overflow: auto; height: 270px; padding: 10px; }
.think-page-trace-tab-cont p { margin: 0; padding: 5px 0; border-bottom: 1px solid #f0f0f0; }
</style>
<div id="think_page_trace">
    <div id="think_page_trace_tab">
        <div class="think-page-trace-tab-tit">
            <span class="active" onclick="showTab(0)">Basic</span>
            <span onclick="showTab(1)">File</span>
            <span onclick="showTab(2)">SQL</span>
            <span onclick="showTab(3)">Log</span>
            <div id="think_page_trace_close" onclick="closeTrace()">x</div>
        </div>
        <div class="think-page-trace-tab-cont" id="tab_0" style="display:block">
            <p>Time: {{.time}}s</p>
        </div>
        <div class="think-page-trace-tab-cont" id="tab_1" style="display:none">
            {{range .files}}<p>{{.}}</p>{{end}}
        </div>
        <div class="think-page-trace-tab-cont" id="tab_2" style="display:none">
            {{range .sqls}}<p>{{.}}</p>{{end}}
        </div>
        <div class="think-page-trace-tab-cont" id="tab_3" style="display:none">
            {{range .logs}}<p>{{.}}</p>{{end}}
        </div>
    </div>
    <div id="think_page_trace_open" onclick="openTrace()">ThinkGo Trace</div>
</div>
<script>
function openTrace() {
    document.getElementById('think_page_trace_tab').style.display = 'block';
    document.getElementById('think_page_trace_open').style.display = 'none';
    document.getElementById('think_page_trace_close').style.display = 'block';
}
function closeTrace() {
    document.getElementById('think_page_trace_tab').style.display = 'none';
    document.getElementById('think_page_trace_open').style.display = 'block';
    document.getElementById('think_page_trace_close').style.display = 'none';
}
function showTab(index) {
    var tabs = document.getElementsByClassName('think-page-trace-tab-cont');
    var spans = document.querySelectorAll('.think-page-trace-tab-tit span');
    for (var i = 0; i < tabs.length; i++) {
        tabs[i].style.display = 'none';
        spans[i].className = '';
    }
    tabs[index].style.display = 'block';
    spans[index].className = 'active';
}
</script>
