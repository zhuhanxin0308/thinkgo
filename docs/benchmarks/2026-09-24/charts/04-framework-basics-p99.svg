<text x="30.6" font-weight="bold" fill="var(--c4)" font-size="24" y="57.334">框架基础接口尾延迟</text>
<text x="31.824" y="98.7" textLength="360.927" lengthAdjust="spacingAndGlyphs" class="s3">wrk 固定 128 条连接 · 三次独立重复 · 框架原生 HTTP / 路由 / JSON 入口</text>
<g fill="var(--c3)">
<text x="30.6" y="702.546" textLength="425.414" lengthAdjust="spacingAndGlyphs" class="s17">2026-09-24—25 实测 · WSL2 / i5-12600KF · 应用 4 逻辑 CPU / 2 GiB · 数据库 4 逻辑 CPU / 6 GiB</text>
<text x="30.6" y="717.714" textLength="435.363" lengthAdjust="spacingAndGlyphs" class="s17">PostgreSQL 18.6 · 129 万行预热数据 · 本机 HTTP/1.1 · 相同原生 SQL，非 ORM · 每轮恢复种子数据库</text>
<text x="30.6" y="733.767" textLength="479.438" lengthAdjust="spacingAndGlyphs" class="s17">Go 单进程（GOMAXPROCS=4）· ThinkPHP：Swoole 8 worker + JIT · Laravel：FrankenPHP 16 worker + JIT</text>
<text x="30.6" y="749.611" textLength="403.787" lengthAdjust="spacingAndGlyphs" class="s17">PHP 均为 8.5.10；FrankenPHP 为 ZTS，Swoole 为 NTS；ThinkPHP 在应用层过滤弃用提示。</text>
<text x="30.6" y="765.272" textLength="323" lengthAdjust="spacingAndGlyphs" class="s17">分位数为各轮分位数的中位数，未合并全部请求；吞吐与尾延迟需同时阅读。</text>
</g>
