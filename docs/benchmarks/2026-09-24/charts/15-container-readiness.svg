<text x="30.6" font-weight="bold" fill="var(--c4)" font-size="24" y="47.29">容器启动到健康就绪的耗时</text>
<text x="31.824" y="74.605" textLength="431.518" lengthAdjust="spacingAndGlyphs" class="s3">固定 64 VU 对应的三次启动 · 柱和标注为中位数 · 误差线为最小—最大值（非置信区间）</text>
<g fill="var(--c3)">
<text x="30.6" y="516.174" textLength="425.414" lengthAdjust="spacingAndGlyphs" class="s19">2026-09-24—25 实测 · WSL2 / i5-12600KF · 应用 4 逻辑 CPU / 2 GiB · 数据库 4 逻辑 CPU / 6 GiB</text>
<text x="30.6" y="531.342" textLength="435.363" lengthAdjust="spacingAndGlyphs" class="s19">PostgreSQL 18.6 · 129 万行预热数据 · 本机 HTTP/1.1 · 相同原生 SQL，非 ORM · 每轮恢复种子数据库</text>
<text x="30.6" y="547.395" textLength="479.438" lengthAdjust="spacingAndGlyphs" class="s19">Go 单进程（GOMAXPROCS=4）· ThinkPHP：Swoole 8 worker + JIT · Laravel：FrankenPHP 16 worker + JIT</text>
<text x="30.6" y="563.239" textLength="403.787" lengthAdjust="spacingAndGlyphs" class="s19">PHP 均为 8.5.10；FrankenPHP 为 ZTS，Swoole 为 NTS；ThinkPHP 在应用层过滤弃用提示。</text>
<text x="30.6" y="578.449" textLength="513.585" lengthAdjust="spacingAndGlyphs" class="s19">从 docker run 到健康就绪并完成 inspect，含 PHP 生产缓存重建；这是部署流程耗时，不是纯框架初始化或首请求耗时。</text>
</g>
