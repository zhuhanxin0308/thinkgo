<text x="30.6" font-weight="bold" fill="var(--c3)" font-size="24" y="47.29">固定到达率下，哪些请求没能发出</text>
<text x="31.824" y="74.529" textLength="392.399" lengthAdjust="spacingAndGlyphs" class="s4">每格为丢弃比例：未发出迭代 ÷（已发请求 + 未发出迭代）· 每档一次 20 秒测量</text>
<g fill="var(--c2)">
<text x="30.6" y="516.174" textLength="425.414" lengthAdjust="spacingAndGlyphs" class="s15">2026-09-24—25 实测 · WSL2 / i5-12600KF · 应用 4 逻辑 CPU / 2 GiB · 数据库 4 逻辑 CPU / 6 GiB</text>
<text x="30.6" y="531.342" textLength="435.363" lengthAdjust="spacingAndGlyphs" class="s15">PostgreSQL 18.6 · 129 万行预热数据 · 本机 HTTP/1.1 · 相同原生 SQL，非 ORM · 每轮恢复种子数据库</text>
<text x="30.6" y="547.395" textLength="479.438" lengthAdjust="spacingAndGlyphs" class="s15">Go 单进程（GOMAXPROCS=4）· ThinkPHP：Swoole 8 worker + JIT · Laravel：FrankenPHP 16 worker + JIT</text>
<text x="30.6" y="563.239" textLength="403.787" lengthAdjust="spacingAndGlyphs" class="s15">PHP 均为 8.5.10；FrankenPHP 为 ZTS，Swoole 为 NTS；ThinkPHP 在应用层过滤弃用提示。</text>
<text x="30.6" y="578.946" textLength="501.921" lengthAdjust="spacingAndGlyphs" class="s15">各框架绝对目标 RPS 不同，不能据此排总名次；k6 预分配 128 VU、上限 512；丢弃不等于 HTTP 失败或服务端拒绝。</text>
</g>
