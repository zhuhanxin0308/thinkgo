<text x="30.6" font-weight="bold" fill="var(--c4)" font-size="24" y="47.29">应用与数据库的 CPU 占用</text>
<text x="31.824" y="74.584" textLength="327.918" lengthAdjust="spacingAndGlyphs" class="s3">固定 64 VU · 实心：应用；点纹：数据库 · 数值顺序为应用 / 数据库</text>
<g fill="var(--c3)">
<text x="30.6" y="516.174" textLength="425.414" lengthAdjust="spacingAndGlyphs" class="s26">2026-09-24—25 实测 · WSL2 / i5-12600KF · 应用 4 逻辑 CPU / 2 GiB · 数据库 4 逻辑 CPU / 6 GiB</text>
<text x="30.6" y="531.342" textLength="435.363" lengthAdjust="spacingAndGlyphs" class="s26">PostgreSQL 18.6 · 129 万行预热数据 · 本机 HTTP/1.1 · 相同原生 SQL，非 ORM · 每轮恢复种子数据库</text>
<text x="30.6" y="547.395" textLength="479.438" lengthAdjust="spacingAndGlyphs" class="s26">Go 单进程（GOMAXPROCS=4）· ThinkPHP：Swoole 8 worker + JIT · Laravel：FrankenPHP 16 worker + JIT</text>
<text x="30.6" y="563.239" textLength="403.787" lengthAdjust="spacingAndGlyphs" class="s26">PHP 均为 8.5.10；FrankenPHP 为 ZTS，Swoole 为 NTS；ThinkPHP 在应用层过滤弃用提示。</text>
<text x="30.6" y="578.939" textLength="390.131" lengthAdjust="spacingAndGlyphs" class="s26">由 cgroup CPU 累计时间差 / 采样窗口时长计算；每轮均值再取三轮中位数，非瞬时峰值。</text>
</g>
