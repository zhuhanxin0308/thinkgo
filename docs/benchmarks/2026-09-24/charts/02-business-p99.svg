<text x="30.6" font-weight="bold" fill="var(--c4)" font-size="24" y="47.29" textLength="251.67" lengthAdjust="spacingAndGlyphs">三类应用的 P99 尾延迟</text>
<text x="31.824" y="74.584" textLength="301.73" lengthAdjust="spacingAndGlyphs" class="s3">相同业务配比 · 固定 64 个虚拟用户 · 完整且零错误的三次重复</text>
<g fill="var(--c3)">
<text x="30.6" y="516.174" textLength="425.414" lengthAdjust="spacingAndGlyphs" class="s17">2026-09-24—25 实测 · WSL2 / i5-12600KF · 应用 4 逻辑 CPU / 2 GiB · 数据库 4 逻辑 CPU / 6 GiB</text>
<text x="30.6" y="531.342" textLength="435.363" lengthAdjust="spacingAndGlyphs" class="s17">PostgreSQL 18.6 · 129 万行预热数据 · 本机 HTTP/1.1 · 相同原生 SQL，非 ORM · 每轮恢复种子数据库</text>
<text x="30.6" y="547.395" textLength="479.438" lengthAdjust="spacingAndGlyphs" class="s17">Go 单进程（GOMAXPROCS=4）· ThinkPHP：Swoole 8 worker + JIT · Laravel：FrankenPHP 16 worker + JIT</text>
<text x="30.6" y="563.239" textLength="403.787" lengthAdjust="spacingAndGlyphs" class="s17">PHP 均为 8.5.10；FrankenPHP 为 ZTS，Swoole 为 NTS；ThinkPHP 在应用层过滤弃用提示。</text>
<text x="30.6" y="578.9" textLength="323" lengthAdjust="spacingAndGlyphs" class="s17">分位数为各轮分位数的中位数，未合并全部请求；吞吐与尾延迟需同时阅读。</text>
</g>
