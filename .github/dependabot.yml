version: 2

updates:
  # Go 模块仅创建升级请求，不在 CI 中自动改写依赖清单。
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    rebase-strategy: auto
    labels:
      - dependencies

  # Action 固定到提交哈希，由升级请求显式审查新提交后再更新。
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:30"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    rebase-strategy: auto
    labels:
      - dependencies
