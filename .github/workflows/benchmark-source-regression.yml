name: Temporary benchmark source regression

on:
  push:
    branches:
      - fix/benchmark-source-inputs-20261123

permissions:
  contents: read

concurrency:
  group: benchmark-source-regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-regression:
    name: Benchmark source regression
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GOTOOLCHAIN: local
      GOWORK: "off"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      # 临时工作流只验证本修复分支，正式 PR 前删除。
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: benchmarks/business/tools/requirements.txt
      - name: Install locked test dependencies
        run: |
          python -m pip install --only-binary=:all: --require-hashes -r benchmarks/business/tools/requirements.txt
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: benchmarks/business/go/go.mod
          cache: false
          check-latest: false
      - name: Record tested source and toolchain
        run: |
          git rev-parse HEAD
          go version
      - name: Run benchmark regression tests
        working-directory: benchmarks/business/tools
        run: python -m coverage run --data-file="$RUNNER_TEMP/benchmark-source.coverage" --branch --source=. --omit="*/test_*.py" -m unittest discover -v
      - name: Report benchmark coverage
        if: always()
        working-directory: benchmarks/business/tools
        run: python -m coverage report --data-file="$RUNNER_TEMP/benchmark-source.coverage" --show-missing
      - name: Build actual benchmark commands
        working-directory: benchmarks/business/go
        env:
          GOFLAGS: ""
          CGO_ENABLED: "1"
          GOOS: linux
          GOARCH: amd64
          GOAMD64: v1
        run: go build -trimpath -mod=readonly -buildvcs=true -p=2 -o ../bin/ ./cmd/...
      - name: Validate actual repository build inputs
        working-directory: benchmarks/business/tools
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import subprocess

          from build_inputs import verify_inputs
          from experiment import load_protocol
          from provenance import collect, committed_sources, definitions, digest, require_measurement_sources

          root = Path.cwd().parent
          repository = root.parents[1]
          protocol = load_protocol(root / "contracts/protocol.json")
          commit = subprocess.check_output(["git", "rev-parse", "HEAD"], cwd=repository, text=True).strip()
          require_measurement_sources(repository, protocol)
          binaries = {name: digest(root / "bin" / name) for name in definitions(protocol)}
          records = collect(repository, root, protocol, binaries, "go")
          verify_inputs(repository, protocol, records, commit, committed_sources(repository, commit), "go")
          require_measurement_sources(repository, protocol)
          print(json.dumps({"commit": commit, "commands": sorted(binaries), "source_input_validation": "passed"}))
          PY
