name: Temporary benchmark source regression

on:
  push:
    branches:
      - fix/benchmark-source-inputs-20261123

permissions:
  contents: read

concurrency:
  group: benchmark-source-regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-regression:
    name: Benchmark source regression
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GOTOOLCHAIN: local
      GOWORK: "off"
      PYTHONDONTWRITEBYTECODE: "1"
      COVERAGE_FILE: ${{ runner.temp }}/benchmark-source.coverage
    steps:
      # 临时工作流只验证本修复分支，正式 PR 前删除。
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: benchmarks/business/tools/requirements.txt
      - name: Install locked test dependencies
        run: python -m pip install --only-binary=:all: --require-hashes -r benchmarks/business/tools/requirements.txt
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: benchmarks/business/go/go.mod
          cache: false
          check-latest: false
      - name: Record tested source and toolchain
        run: |
          git rev-parse HEAD
          go version
      - name: Run benchmark regression tests
        working-directory: benchmarks/business/tools
        run: python -m coverage run --branch --source=. --omit="*/test_*.py" -m unittest discover -v
      - name: Report benchmark coverage
        if: always()
        working-directory: benchmarks/business/tools
        run: python -m coverage report --show-missing
