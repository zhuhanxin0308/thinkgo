name: Temporary offline audit toolchain

on:
  push:
    branches: [codex/module-audit-20261001]
    paths: [.github/workflows/module-audit-toolchain.yml]

permissions:
  contents: read

jobs:
  toolchain:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GOTOOLCHAIN: local
      GOWORK: off
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: false
      - name: Export only Go SDK and verified module cache
        shell: bash
        run: |
          set -euo pipefail
          export GOMODCACHE="$RUNNER_TEMP/audit-modcache"
          go mod download
          go mod verify
          mkdir -p "$RUNNER_TEMP/audit-sdk"
          tar -czf "$RUNNER_TEMP/audit-sdk/go.tar.gz" -C "$(go env GOROOT)" .
          tar -czf "$RUNNER_TEMP/audit-sdk/modules.tar.gz" -C "$GOMODCACHE" .
          go version > "$RUNNER_TEMP/audit-sdk/VERSION.txt"
          cp go.mod go.sum "$RUNNER_TEMP/audit-sdk/"
          cd "$RUNNER_TEMP/audit-sdk"
          sha256sum go.tar.gz modules.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: thinkgo-audit-toolchain
          path: ${{ runner.temp }}/audit-sdk
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
