name: Offline verification snapshot

on:
  push:
    branches: [ci/offline-verification-4410449]
    paths: [.github/workflows/offline-verification-snapshot.yml]

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GOTOOLCHAIN: local
      GOWORK: off
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: false
      - name: Export only fixed public source and verified module files
        shell: bash
        run: |
          set -euo pipefail
          export GOMODCACHE="$RUNNER_TEMP/verification-modules"
          go mod download
          go mod verify
          out="$RUNNER_TEMP/verification-snapshot"
          mkdir -p "$out"
          git archive --format=tar.gz 4410449cb1eb2eda3c9014b288ff636c0621d044 > "$out/source.tar.gz"
          tar -czf "$out/modules.tar.gz" -C "$GOMODCACHE" .
          go version > "$out/VERSION.txt"
          git rev-parse '4410449cb1eb2eda3c9014b288ff636c0621d044^{tree}' > "$out/TREE.txt"
          cd "$out"
          sha256sum source.tar.gz modules.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: verification-snapshot-4410449
          path: ${{ runner.temp }}/verification-snapshot
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
